services:
    dev:
        image: node:22-bookworm-slim
        working_dir: /app
        volumes:
            - .:/app
        ports:
            - '5174:5174'
        command: sh -c "npm install && npm run dev -- --host"

    # A prison for claude coding agent
    prison:
        build:
            context: .
            dockerfile: Dockerfile.prison
        profiles: ['tools']
        working_dir: /app
        volumes:
            - .:/app
        tty: true
        stdin_open: true
